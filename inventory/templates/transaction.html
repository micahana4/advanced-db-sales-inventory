{% extends "base.html" %}
{% load static %}
{% block content %}
<p class="eyebrow">Stock movements</p>
<h1>{{ title }}</h1>
<form method="post" class="panel">
  {% csrf_token %}
  {{ form.as_p }}
  <h2 class="h5">Items</h2>
  {{ lines.management_form }}
  {{ lines.non_form_errors }}
  <div id="lines">
    {% for line in lines %}<fieldset class="border rounded p-3 mb-2">{{ line.as_p }}</fieldset>{% endfor %}
  </div>
  <template id="line-template"><fieldset class="border rounded p-3 mb-2">{{ lines.empty_form.as_p }}</fieldset></template>
  <div class="d-flex flex-wrap gap-2 mt-3">
    <button type="button" id="add-line" class="btn btn-outline-primary">Add item</button>
    <button type="button" id="remove-line" class="btn btn-outline-secondary">Remove last item</button>
    <button class="btn btn-primary">Post {{ title|lower }}</button>
    <a class="btn btn-light" href="{% url 'dashboard' %}">Cancel</a>
  </div>
</form>
<script src="{% static 'inventory/lines.js' %}" defer></script>
{% endblock %}
